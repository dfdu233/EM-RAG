[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emrag"
version = "0.1.0"
description = "Training-free evidence-audited multi-round RAG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "EM-RAG Contributors"}]
dependencies = []

[project.optional-dependencies]
api = ["openai>=1.50,<3"]
test = ["pytest>=8,<10"]
all = ["openai>=1.50,<3", "pytest>=8,<10"]

[project.scripts]
emrag = "emrag.cli:main"

[tool.setuptools.packages.find]
include = ["emrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
